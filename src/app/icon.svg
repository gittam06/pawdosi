<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pawdosi">
  <!--
    Marigold tile with a white paw, matching the Logo component.
    Kept to flat shapes with generous spacing: a favicon is read at 16px, so
    anything finer than this turns to mush.
  -->
  <rect width="64" height="64" rx="15" fill="#C8540F" />
  <g fill="#FFFFFF">
    <ellipse cx="20.5" cy="26" rx="6" ry="7.5" transform="rotate(-18 20.5 26)" />
    <ellipse cx="32" cy="21" rx="6" ry="8" />
    <ellipse cx="43.5" cy="26" rx="6" ry="7.5" transform="rotate(18 43.5 26)" />
    <ellipse cx="32" cy="44" rx="13" ry="10.5" />
  </g>
</svg>
